name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test API & build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: API tests (real MongoDB in memory)
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Build React app
        working-directory: client
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 3

  surakshit-gate:
    name: Surakshit Gate tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API tests (acceptance checklist, real MongoDB in memory)
        working-directory: surakshit-gate/server
        run: npm ci && npm test
      - name: Check every Hindi text has English
        working-directory: surakshit-gate/client
        run: npm ci && npm run i18n:check
      - name: Build web app
        working-directory: surakshit-gate/client
        run: npm run build

  deploy:
    name: Deploy to VPS (optional)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::notice::No VPS_HOST secret - skipping auto deploy. Deploy manually with the one-line command in README."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run installer on VPS
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/install.sh | BRANCH=${{ github.ref_name }} bash
